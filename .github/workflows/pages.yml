# Publishes the game to GitHub Pages on every push to the default branch.
# Requires: Settings -> Pages -> Source: "GitHub Actions" (or run once manually).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/busy-tesla-9efzv1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the static site
        run: |
          mkdir _site
          cp -r index.html css js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
