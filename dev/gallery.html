<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галерея юнитов (dev)</title>
<style>
  body { margin: 0; background: #5fae3c; font: 12px/1.3 sans-serif; color: #fff; }
  .row { display: flex; align-items: flex-end; gap: 6px; padding: 8px; flex-wrap: wrap; }
  canvas { background: linear-gradient(#bfe6ff, #8fd466); border-radius: 6px; }
  h3 { margin: 6px 8px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../js/art/util.js"></script>
<script src="../js/art/units-infantry.js"></script>
<script src="../js/art/units-heavy.js"></script>
<script src="../js/art/units.js"></script>
<script>
Art.dpr = 2;
const TYPES = ['peasant', 'spearman', 'archer', 'knight', 'crossbowman', 'mage', 'commander', 'cavalry', 'catapult'];
const WIDE = ['cavalry', 'catapult', 'commander', 'spearman'];
const only = new URLSearchParams(location.search).get('only');
const root = document.getElementById('root');
const cells = [];
// poses shown for each type: walk (animated), ready, windup, strike frames
const STATES = [
  { n: 'walk',  f: t => ({ ph: t * 9, walk: 1, wind: 0, strike: -1, t, seed: 1 }) },
  { n: 'ready', f: t => ({ ph: 0, walk: 0, wind: 0, strike: -1, t, seed: 1 }) },
  { n: 'wind .5', f: t => ({ ph: 0, walk: 0, wind: 0.5, strike: -1, t, seed: 1 }) },
  { n: 'wind 1', f: t => ({ ph: 0, walk: 0, wind: 1, strike: -1, t, seed: 1 }) },
  { n: 'hit 0', f: t => ({ ph: 0, walk: 0, wind: 0, strike: 0.02, t, seed: 1 }) },
  { n: 'hit .2', f: t => ({ ph: 0, walk: 0, wind: 0, strike: 0.2, t, seed: 1 }) },
  { n: 'hit .5', f: t => ({ ph: 0, walk: 0, wind: 0, strike: 0.5, t, seed: 1 }) },
];
const SCALE = +(new URLSearchParams(location.search).get('s') || 2);
for (const team of (new URLSearchParams(location.search).get('team') || 'player,enemy').split(',')) {
  const h = document.createElement('h3'); h.textContent = team; root.appendChild(h);
  for (const id of TYPES) {
    const row = document.createElement('div'); row.className = 'row'; root.appendChild(row);
    const wide = WIDE.includes(id);
    if (only && !only.split(',').includes(id)) continue;
    for (const st of STATES) {
      const c = document.createElement('canvas');
      const W = wide ? 160 : 100, H = (id === 'commander' ? 130 : wide ? 130 : 100);
      c.width = W * SCALE * 2; c.height = H * SCALE * 2; c.style.width = W * SCALE + 'px'; c.style.height = H * SCALE + 'px';
      row.appendChild(c);
      cells.push({ c, id, team, st, W, H, g: c.getContext('2d') });
    }
  }
}
function frame(ms) {
  const t = ms / 1000;
  for (const k of cells) {
    const g = k.g; g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,k.c.width,k.c.height);
    const s = SCALE * 2;
    g.setTransform(s, 0, 0, s, (k.W / 2 - (WIDE.includes(k.id) ? 14 : 4)) * s, (k.H - 8) * s);
    const dir = k.team === 'player' ? 1 : -1;
    g.scale(dir, 1);
    g.fillStyle = 'rgba(20,45,12,.3)'; g.beginPath(); g.ellipse(0, 1, 18, 5, 0, 0, 7); g.fill();
    try { Art.units.drawBody(g, k.id, k.team, k.st.f(t)); } catch (e) { if (!k.err) { k.err = 1; console.error(k.id + ': ' + e.message); } }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
